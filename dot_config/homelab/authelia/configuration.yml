theme: auto
server:
  address: tcp://:9091
authentication_backend:
  file:
    path: /config/users.yml
access_control:
  default_policy: two_factor
session:
  cookies:
    - domain: ravennest.link
      authelia_url: https://auth.ravennest.link
      default_redirection_url: https://glance.ravennest.link
storage:
  local:
    path: /config/db.sqlite3
notifier:
  smtp:
    address: submissions://smtp.resend.com:465
    username: resend
    sender: "Authelia <authelia@ravennest.link>"
totp:
  issuer: ravennest.link

# secrets come from podman secrets through the template filter, so this file stays safe to publish
identity_providers:
  oidc:
    jwks:
      - key: {{ secret "/run/secrets/authelia_oidc_jwk" | mindent 10 "|" | msquote }}
    # Cloudflare Access reads claims from the ID token only
    claims_policies:
      cloudflare:
        id_token: [rat, groups, email, email_verified, alt_emails, preferred_username, name]
    clients:
      - client_id: cloudflare
        client_name: Cloudflare Access
        client_secret: '{{ secret "/run/secrets/oidc_cloudflare_digest" }}'
        authorization_policy: two_factor
        consent_mode: implicit
        claims_policy: cloudflare
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://summer-hat-05b4.cloudflareaccess.com/cdn-cgi/access/callback
        scopes: [openid, profile, email]
        token_endpoint_auth_method: client_secret_basic
      - client_id: paperless
        client_name: Paperless
        client_secret: '{{ secret "/run/secrets/oidc_paperless_digest" }}'
        authorization_policy: two_factor
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://docs.ravennest.link/accounts/oidc/authelia/login/callback/
        scopes: [openid, profile, email, groups]
        token_endpoint_auth_method: client_secret_basic
      - client_id: karakeep
        client_name: Karakeep
        client_secret: '{{ secret "/run/secrets/oidc_karakeep_digest" }}'
        authorization_policy: two_factor
        consent_mode: implicit
        redirect_uris:
          - https://keep.ravennest.link/api/auth/callback/custom
        scopes: [openid, profile, email]
        token_endpoint_auth_method: client_secret_basic
      - client_id: adventurelog
        client_name: AdventureLog
        client_secret: '{{ secret "/run/secrets/oidc_adventurelog_digest" }}'
        authorization_policy: two_factor
        consent_mode: implicit
        # the second uri works around an adventurelog bug that uses the client id as the provider id
        redirect_uris:
          - https://trips.ravennest.link/accounts/oidc/authelia/login/callback/
          - https://trips.ravennest.link/accounts/oidc/adventurelog/login/callback/
        scopes: [openid, email, profile]
        token_endpoint_auth_method: client_secret_basic
      - client_id: actual
        client_name: Actual Budget
        client_secret: '{{ secret "/run/secrets/oidc_actual_digest" }}'
        authorization_policy: two_factor
        consent_mode: implicit
        redirect_uris:
          - https://budget.ravennest.link/openid/callback
        scopes: [openid, profile, groups, email]
        token_endpoint_auth_method: client_secret_basic
      - client_id: freshrss
        client_name: FreshRSS
        client_secret: '{{ secret "/run/secrets/oidc_freshrss_digest" }}'
        authorization_policy: two_factor
        consent_mode: implicit
        # freshrss sometimes sends the port in the redirect uri
        redirect_uris:
          - https://rss.ravennest.link/i/oidc/
          - https://rss.ravennest.link:443/i/oidc/
        scopes: [openid, groups, email, profile]
        token_endpoint_auth_method: client_secret_basic
      - client_id: immich
        client_name: Immich
        client_secret: '{{ secret "/run/secrets/oidc_immich_digest" }}'
        authorization_policy: two_factor
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://photos.ravennest.link/auth/login
          - https://photos.ravennest.link/user-settings
          - http://100.67.166.24:2283/auth/login
          - http://100.67.166.24:2283/user-settings
          - app.immich:///oauth-callback
        scopes: [openid, profile, email]
        token_endpoint_auth_method: client_secret_basic
