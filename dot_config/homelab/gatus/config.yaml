storage:
  type: sqlite
  path: /data/data.db

ui:
  title: homelab status
  header: homelab

alerting:
  ntfy:
    topic: "${NTFY_TOPIC}"
    priority: 4
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

x-alert: &alert
  alerts:
    - type: ntfy

endpoints:
  - name: hindsight
    group: apps
    url: http://100.84.190.78:8888/health
    conditions: ["[STATUS] == 200"]
    <<: *alert
  - name: logseq sync
    group: apps
    url: https://logseq.ravennest.link/health
    conditions: ["[STATUS] == 200"]
    <<: *alert
  - name: activepieces
    group: apps
    url: https://flows.ravennest.link/
    conditions: ["[STATUS] == 200"]
    <<: *alert
  - name: glance
    group: apps
    url: http://glance:8080/
    conditions: ["[STATUS] == 200"]
    <<: *alert
  - name: adventurelog
    group: apps
    url: http://adventurelog:80/
    conditions: ["[STATUS] == 200"]
    <<: *alert
  - name: actual
    group: apps
    url: http://actual:5006/
    conditions: ["[STATUS] == 200"]
    <<: *alert
  - name: paperless
    group: apps
    url: http://paperless:8000/accounts/login/
    conditions: ["[STATUS] == 200"]
    <<: *alert
  - name: mealie
    group: apps
    url: http://mealie:9000/api/app/about
    conditions: ["[STATUS] == 200"]
    <<: *alert
  - name: freshrss
    group: apps
    url: http://freshrss:80/i/
    conditions: ["[STATUS] == 200"]
    <<: *alert
  - name: atuin
    group: apps
    url: http://atuin:8888/
    conditions: ["[STATUS] == 200"]
    <<: *alert
  - name: karakeep
    group: apps
    url: http://karakeep:3000/api/health
    conditions: ["[STATUS] == 200"]
    <<: *alert
