storage:
  type: sqlite
  path: /data/data.db

ui:
  title: homelab status
  header: homelab
  buttons:
    - name: Karakeep
      link: https://keep.ravennest.link
    - name: Actual
      link: https://budget.ravennest.link
    - name: Paperless
      link: https://docs.ravennest.link
    - name: FreshRSS
      link: https://rss.ravennest.link
    - name: AdventureLog
      link: https://trips.ravennest.link
    - name: Activepieces
      link: https://flows.ravennest.link
    - name: Glance
      link: https://glance.ravennest.link

alerting:
  ntfy:
    topic: "${NTFY_TOPIC}"
    priority: 4
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

x-alert: &alert
  alerts:
    - type: ntfy

x-ui: &ui
  hide-hostname: true

endpoints:
  - name: hindsight
    group: apps
    url: http://hindsight:8888/health
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
  - name: logseq sync
    group: apps
    url: https://logseq.ravennest.link/health
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
  - name: activepieces
    group: apps
    url: http://activepieces:80/
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
  - name: glance
    group: apps
    url: http://glance:8080/
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
  - name: adventurelog
    group: apps
    url: http://adventurelog:80/
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
  - name: actual
    group: apps
    url: http://actual:5006/
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
  - name: paperless
    group: apps
    url: http://paperless:8000/accounts/login/
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
  - name: freshrss
    group: apps
    url: http://freshrss:80/api/
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
  - name: atuin
    group: apps
    url: http://atuin:8888/
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
  - name: karakeep
    group: apps
    url: http://karakeep:3000/api/health
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
  - name: authelia
    group: apps
    url: http://authelia:9091/api/health
    conditions: ["[STATUS] == 200"]
    ui: *ui
    <<: *alert
