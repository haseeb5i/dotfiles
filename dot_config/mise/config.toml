[tools]
node = "lts"
bun = "latest"
pnpm = "latest"
go = "latest"
python = "latest"
uv = "latest"
ruby = "3.3"
dotnet = "latest"

# Fedora installs these with dnf
bat = { version = "latest", os = ["macos"] }
eza = { version = "latest", os = ["macos"] }
fzf = { version = "latest", os = ["macos"] }
fd = { version = "latest", os = ["macos"] }
ripgrep = { version = "latest", os = ["macos"] }
zoxide = { version = "latest", os = ["macos"] }

starship = "latest"
lazygit = "latest"
usage = "latest"
"github:alltuner/mise-completions-sync" = "latest"

# harness CLIs; claude, claude-mem, opencode and plannotator stay on their own installers (self-updating)
"npm:@colbymchenry/codegraph" = "latest"
rtk = "latest"
herdr = "latest"
"github:perplexityai/perplexity-cli" = { version = "latest", bin = "pplx" }
worktrunk = "latest"
oxker = "latest"
llmfit = "latest"
bitwarden = "latest"
bitwarden-secrets-manager = "latest"
1password-cli = "latest"

[hooks]
postinstall = "misecompsync --shell zsh"

[settings]
idiomatic_version_file_enable_tools = ["node"]

[settings.ruby]
compile = false
